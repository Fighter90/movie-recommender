<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content-Based Movie Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Content-Based Movie Recommender</h1>
        <p>Select a movie you like, and we'll find similar ones for you!</p>

        <section class="controls" aria-label="Item-to-item recommendations">
            <select id="movie-select">
                <option value="" disabled selected>Select a movie</option>
            </select>
            <button id="recommend-btn" onclick="getRecommendations()">Get Recommendations</button>
        </section>

        <section class="profile-section" aria-labelledby="profile-heading">
            <h2 id="profile-heading">Build a taste profile</h2>
            <p>Choose three watched movies to find recommendations from your combined genres.</p>
            <div class="controls">
                <select id="watched-1">
                    <option value="" disabled selected>Select a movie</option>
                </select>
                <select id="watched-2">
                    <option value="" disabled selected>Select a movie</option>
                </select>
                <select id="watched-3">
                    <option value="" disabled selected>Select a movie</option>
                </select>
                <button id="profile-recommend-btn" onclick="getProfileRecommendations()">Recommend from profile</button>
            </div>
        </section>

        <div id="result-box">
            <p id="result">Please wait, loading data...</p>
        </div>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
